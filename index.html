<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Flipping Simulator - Anticipation Update</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b0c10;
            --panel: #1f2833;
            --text: #c5c6c7;
            --accent: #66fcf1;
            --accent-dark: #45a29e;
            --lose: #ff4757;
            --win: #2ed573;
            --gold: #ffd700;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0 0 40px 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        #global-loader {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
            padding: 20px;
        }
        #global-loader h1 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
            text-align: center;
            font-size: 1.8rem;
        }
        .global-progress-container {
            width: 100%;
            max-width: 400px;
            height: 20px;
            background: #111;
            border: 2px solid #444;
            border-radius: 4px;
            padding: 2px;
            margin-top: 20px;
        }
        .global-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }
        .loading-text {
            color: #aaa;
            margin-top: 15px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            animation: pulse 1s infinite;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(31, 40, 51, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 15px;
            border-bottom: 3px solid var(--accent-dark);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .balance { font-size: 1.1rem; font-weight: bold; color: white; }
        .balance span { color: var(--accent); }
        
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: 0.2s all;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; transform: none; }
        
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            padding: 15px 0; 
        }
        h2 { color: white; font-size: 1.3rem; margin: 5px 0 10px 0;}
        
        .car-carousel {
            display: flex;
            overflow-x: auto;
            gap: 12px; 
            padding: 10px 20px 20px 20px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        .car-carousel::-webkit-scrollbar { height: 6px; }
        .car-carousel::-webkit-scrollbar-track { background: #111; border-radius: 3px; }
        .car-carousel::-webkit-scrollbar-thumb { background: var(--accent-dark); border-radius: 3px; }

        .car-card {
            background: var(--panel);
            padding: 15px 10px; 
            border-radius: 10px;
            border: 2px solid #333;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            flex: 0 0 170px; 
            min-height: 260px; 
            scroll-snap-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        .car-card:active { transform: scale(0.98); border-color: var(--accent); }
        .car-card h3 { 
            margin: 15px 0 0 0; 
            color: white; 
            font-size: 1rem; 
            text-align: center;
            line-height: 1.2;
            min-height: 2.4rem; 
            display: flex;
            align-items: center;
        }
        
        .car-icon-container {
            width: 100%;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            border: 1px solid #333;
        }

        .car-info-row {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 4px;
            width: 100%;
            margin: 5px 0;
            font-size: 0.85rem;
            color: #aaa;
        }
        .car-info-row span { color: white; font-weight: bold; }

        .tier-badge {
            position: absolute;
            top: 0; right: 0;
            padding: 4px 8px;
            font-size: 0.65rem;
            font-weight: bold;
            border-bottom-left-radius: 8px;
            text-transform: uppercase;
        }
        .tier-cheap { background: #747d8c; color: white; }
        .tier-normal { background: #3742fa; color: white; }
        .tier-luxury { background: var(--gold); color: black; }

        .pot-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            margin: 0;
            border: 1px solid currentColor;
            text-transform: uppercase;
        }
        .pot-0 { color: #a4b0be; } 
        .pot-1 { color: #3498db; } 
        .pot-2 { color: #9b59b6; } 
        .pot-3 { color: #ff4757; text-shadow: 0 0 8px rgba(255,71,87,0.5); font-weight: 900;}

        .action-area {
            background: var(--panel);
            padding: 20px 15px;
            border-radius: 10px;
            margin: 10px 15px;
            display: none;
            border: 1px solid #444;
            position: relative;
        }
        
        .action-buttons { 
            display: flex; 
            flex-direction: column;
            gap: 10px; 
            margin-top: 20px; 
        }
        .btn-sell, .btn-fix, .btn-cancel { width: 100%; padding: 12px; font-size: 0.95rem; }
        .btn-sell { background: var(--win); color: white; }
        .btn-fix { background: var(--gold); color: black; }
        .btn-cancel { background: transparent; border: 1px solid #555; color: #ccc; }

        .progress-container {
            width: 100%;
            max-width: 320px;
            height: 12px;
            background: #111;
            border: 1px solid #444;
            border-radius: 6px;
            margin: 15px auto;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent));
            border-radius: 6px;
        }
        .progress-bar.gold { background: linear-gradient(90deg, #ffa502, var(--gold)); }

        #overlay-loader {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(31, 40, 51, 0.95);
            border-radius: 10px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }

        #repair-result-banner {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            animation: fadeIn 0.4s ease-in-out;
        }
        .repair-fail { background: rgba(255, 71, 87, 0.2); border: 1px solid var(--lose); color: var(--lose); }
        .repair-shoddy { background: rgba(255, 165, 2, 0.2); border: 1px solid #ffa502; color: #ffa502; }
        .repair-success { background: rgba(46, 213, 115, 0.2); border: 1px solid var(--win); color: var(--win); }
        .repair-jackpot { background: rgba(255, 215, 0, 0.2); border: 1px solid var(--gold); color: var(--gold); text-shadow: 0 0 5px rgba(255,215,0,0.5); }

        #result-area {
            display: none;
            margin: 15px;
            padding: 25px 15px;
            background: radial-gradient(circle, var(--panel) 0%, var(--bg) 100%);
            border-radius: 10px;
            border: 1px solid #333;
        }
        .status-text {
            font-size: 1rem;
            line-height: 1.4;
            min-height: 2.8rem;
            color: var(--accent);
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .multiplier-display {
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
            margin: 5px 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        .multiplier-display.crashed { color: var(--lose); text-shadow: 0 0 15px rgba(255,71,87,0.4); }
        .multiplier-display.won { color: var(--win); text-shadow: 0 0 20px rgba(46,213,115,0.6); transform: scale(1.05); transition: 0.3s transform; }
        
        .coins-won { font-size: 1rem; color: #aaa; margin-bottom: 20px; height: 20px; }
        .coins-won span { color: var(--gold); font-weight: bold; }
        
        .swipe-hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: -5px;
            margin-bottom: 10px;
            font-style: italic;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid #444; border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        .scrolling-web {
            display: none;
            width: 100%; max-width: 250px;
            height: 40px;
            margin: 0 auto 15px auto;
            border: 2px solid var(--accent-dark);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            background: #111;
        }
        .scroll-lines {
            position: absolute;
            top: 0; left: 10%; width: 80%;
            display: flex; flex-direction: column; gap: 6px;
            animation: scrollUp 0.8s linear infinite;
        }
        .scroll-line { height: 6px; background: #333; border-radius: 3px; }
        .scroll-line:nth-child(even) { background: var(--accent-dark); opacity: 0.5; width: 70%; }
        
        @keyframes scrollUp { 0% { transform: translateY(40px); } 100% { transform: translateY(-40px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="global-loader">
        <h1>Car Flip Simulator</h1>
        <div id="bootCarIcon"></div>
        <div class="global-progress-container">
            <div class="global-progress-bar" id="globalProgressBar"></div>
        </div>
        <div class="loading-text" id="loadingText">Booting Arcade System...</div>
    </div>

    <header>
        <div class="balance">Bal: $<span id="balanceDisplay">1,500</span></div>
        <button onclick="topUp()">+ $1,000</button>
    </header>

    <div class="container">
        <div id="selectionPhase">
            <h2 id="phaseTitle">Select a Car to Flip</h2>
            <div class="swipe-hint">Swipe left for endless deals ➔</div>
            
            <div class="car-carousel" id="carGrid"></div>
        </div>

        <div class="action-area" id="actionArea">
            <div id="overlay-loader">
                <div id="loaderCarIcon" style="margin-bottom: 10px;"></div>
                <div class="spinner"></div>
                <h3 style="color:var(--gold); margin: 0 0 5px 0; font-size: 1rem;">🔧 Working...</h3>
                <div class="progress-container">
                    <div class="progress-bar gold" id="repairProgressBar"></div>
                </div>
            </div>
            
            <div id="actionCarIcon" class="car-icon-container" style="width:140px; height:80px; margin: 0 auto 10px auto;"></div>
            <h2 id="selectedCarName" style="margin-top:0;">Car Name</h2>
            <div id="selectedCarDetails" style="font-size: 0.95rem; line-height: 1.4;"></div>
            <div id="repair-result-banner"></div>

            <div class="action-buttons">
                <button class="btn-fix" id="btnFix" onclick="fixCar()">Fix Car</button>
                <button class="btn-sell" id="btnSell" onclick="startSellPhase()">Sell As Is</button>
            </div>
        </div>

        <div id="result-area">
            <div id="resultCarIcon" class="car-icon-container" style="width:120px; height:70px; margin: 0 auto 15px auto;"></div>

            <div class="scrolling-web" id="searchAnim">
                <div class="scroll-lines">
                    <div class="scroll-line"></div>
                    <div class="scroll-line"></div>
                    <div class="scroll-line"></div>
                    <div class="scroll-line"></div>
                </div>
            </div>
            
            <div class="status-text" id="statusText"></div>

            <div class="progress-container" id="sellProgressContainer" style="display:none; margin-top: 5px;">
                <div class="progress-bar" id="sellProgressBar"></div>
            </div>
            
            <button class="btn-cancel" id="btnSkip" onclick="skipSellAnimation()" style="display:none; margin: 10px auto; width: 100%; padding: 10px;">⏩ Skip Wait</button>

            <div class="multiplier-display" id="multiplierDisplay" style="display:none;">1.00x</div>
            <div class="coins-won" id="coinsWonDisplay"></div>
            <button id="btnNextRound" onclick="startRound()" style="display:none; margin: 0 auto; width: 100%; padding: 12px;">Play Next Round</button>
        </div>
    </div>
    <script>
        const fleet = [
            { name: "Qenault Uwingo", tier: "cheap", basePrice: 2 },
            { name: "Jonda Divic", tier: "cheap", basePrice: 15 },
            { name: "Wolkswagen Holf", tier: "cheap", basePrice: 50 },
            { name: "Voyota Damry", tier: "normal", basePrice: 250 },
            { name: "Jonda Bccord", tier: "normal", basePrice: 600 },
            { name: "Wolkswagen Qassat", tier: "normal", basePrice: 1200 },
            { name: "Nercedes H-Wagon", tier: "luxury", basePrice: 4000 },
            { name: "Gerrari E458", tier: "luxury", basePrice: 7500 },
            { name: "Mamborghini Juracan", tier: "luxury", basePrice: 10000 }
        ];

        const conditions = ["Wrecked", "Normal wear", "Mint"];
        
        // --- 95% RTP MATH MODEL (100x Cap) ---
        const potentialTiers = [
            { id: 0, name: "Normal Win", class: "pot-0", winChance: 0.82, pool: [{min: 1.01, max: 1.15, c: 85}, {min: 1.16, max: 1.50, c: 10}, {min: 1.51, max: 2.50, c: 5}] },
            { id: 1, name: "Big Win", class: "pot-1", winChance: 0.63, pool: [{min: 1.01, max: 1.30, c: 75}, {min: 1.31, max: 2.50, c: 18}, {min: 2.51, max: 5.00, c: 6}, {min: 5.01, max: 10.00, c: 1}] },
            { id: 2, name: "Huge Win", class: "pot-2", winChance: 0.40, pool: [{min: 1.05, max: 1.50, c: 70}, {min: 1.51, max: 4.00, c: 20}, {min: 4.01, max: 10.00, c: 8}, {min: 10.01, max: 25.00, c: 2}] },
            { id: 3, name: "INSANE WIN", class: "pot-3", winChance: 0.18, pool: [{min: 1.05, max: 2.00, c: 65}, {min: 2.01, max: 6.00, c: 22}, {min: 6.01, max: 25.00, c: 10}, {min: 25.01, max: 100.00, c: 3}] }
        ];

        const repairEvents = {
            fail: [
                "💥 Mechanic broke a leg mid-repair! Engine ruined.",
                "🤦 Mechanic dropped your engine block! Severe damage.",
                "🎰 Mechanic gambled your money away and damaged parts.",
                "⚡ Mechanic wired the battery backwards and fried electronics!"
            ],
            shoddy: [
                "🍺 Mechanic was hungover, but duct-taped the bumper (+1 Tier).",
                "🌾 Mechanic used parts from an old lawnmower (+1 Tier).",
                "🛠️ Mechanic patched the leak with chewing gum (+1 Tier)."
            ],
            success: [
                "✨ Mechanic worked overtime and restored it clean (+2 Tiers)!",
                "🏎️ Mechanic tuned the engine to factory perfection (+2 Tiers)!",
                "🧼 Mechanic buffed out every scratch till it shined (+2 Tiers)!"
            ],
            jackpot: [
                "🎂 Mechanic gave you a free twin-turbo upgrade (INSANE TIER)!",
                "🚀 Mechanic secretly installed a nitrous system (INSANE TIER)!",
                "👑 Mechanic accidentally turned your car into a street legend (INSANE TIER)!"
            ]
        };

        const failureMessages = [
            "Nobody needed the car, so it got scrapped!",
            "The car got stolen by Santa Claus and his crew!",
            "A flock of pigeons designated your car a total biohazard zone. Unsellable!",
            "The car spontaneously disassembled itself upon buyer inspection.",
            "A sinkhole opened up in the parking lot and swallowed it whole!",
            "Your car was repossessed by a shady mafia boss claiming it was theirs.",
            "You accidentally left the keys inside and a raccoon drove it into a lake.",
            "The car got struck by lightning and reduced to a pile of ash!",
            "A rogue AI took over the vehicle and drove it straight into outer space.",
            "The test driver mistook the gas for the brake and drove off a cliff!",
            "It failed the emissions test so badly it got outlawed by the UN.",
            "Termites somehow ate through the entire metal chassis. Impressive loss!",
            "The car was towed away because you parked it in front of the White House.",
            "A movie studio bought it, immediately blew it up for an explosion scene, and skipped town without paying.",
            "The gas tank leaked completely, and it was overrun by an angry hive of killer bees.",
            "An eccentric billionaire paid you in Monopoly money, then vanished into thin air.",
            "The car rolled away backwards down a hill because you forgot the handbrake.",
            "Alien abduction! A UFO beamed the vehicle up into the sky.",
            "The buyer turned out to be an undercover cop; the car was confiscated as evidence.",
            "A local monster truck rally used your car as a ramp. Completely flattened!"
        ];

        let balance = 1500;
        let currentOffers = [];
        let activeCar = null;
        let lastRepairBanner = null;
        let isSkipping = false;
        let currentFinalMult = 0;

        function getCarPixelArtSVG(tier, condition, width = 80, height = 50) {
            let baseColor = "#3742fa";
            let windowColor = "#70a1ff";
            let wheelColor = "#1e272e";
            let rimColor = "#d2dae2";

            if (tier === "cheap") baseColor = "#747d8c";
            if (tier === "normal") baseColor = "#3742fa";
            if (tier === "luxury") baseColor = "#ffd700";

            let effects = "";
            
            if (condition === "Wrecked" || condition === "Ruined") {
                baseColor = tier === "cheap" ? "#8c7ae6" : (tier === "luxury" ? "#d35400" : "#57606f");
                windowColor = "#2f3542";
                effects += `
                    <rect x="6" y="2" width="2" height="2" fill="#718093" opacity="0.8"/>
                    <rect x="4" y="0" width="3" height="3" fill="#a6b1e1" opacity="0.6"/>
                    <rect x="22" y="8" width="2" height="2" fill="#e1b12c"/>
                    <rect x="24" y="10" width="3" height="2" fill="#c0392b"/>
                `;
            } else if (condition === "Mint" || condition === "Repaired") {
                effects += `
                    <polygon points="26,3 27,5 29,5 27,7 28,9 26,8 24,9 25,7 23,5 25,5" fill="#ffffff"/>
                    <polygon points="6,6 7,7 8,7 7,8 8,9 7,9 6,10 6,9 5,9 6,8 5,7 6,7" fill="#ffd700"/>
                `;
            } else if (condition === "Tuned Beast") {
                effects += `
                    <rect x="1" y="5" width="2" height="6" fill="#ff4757"/>
                    <rect x="0" y="4" width="5" height="2" fill="#ff4757"/>
                    <rect x="28" y="14" width="4" height="2" fill="#ff3f34"/>
                    <rect x="30" y="13" width="3" height="4" fill="#ffa801"/>
                    <rect x="8" y="18" width="16" height="1" fill="#66fcf1" opacity="0.9"/>
                `;
            }

            let pixels = "";
            if (tier === "cheap") {
                pixels = `
                    <rect x="6" y="8" width="20" height="8" fill="${baseColor}"/>
                    <rect x="10" y="5" width="12" height="4" fill="${baseColor}"/>
                    <rect x="12" y="6" width="4" height="3" fill="${windowColor}"/>
                    <rect x="17" y="6" width="4" height="3" fill="${windowColor}"/>
                    <rect x="4" y="13" width="2" height="3" fill="#2f3542"/>
                    <rect x="26" y="13" width="2" height="3" fill="#2f3542"/>
                    <rect x="8" y="14" width="5" height="5" fill="${wheelColor}"/>
                    <rect x="9" y="15" width="3" height="3" fill="${rimColor}"/>
                    <rect x="19" y="14" width="5" height="5" fill="${wheelColor}"/>
                    <rect x="20" y="15" width="3" height="3" fill="${rimColor}"/>
                    <rect x="25" y="10" width="2" height="2" fill="#fbc531"/>
                `;
            } else if (tier === "normal") {
                pixels = `
                    <rect x="4" y="10" width="24" height="6" fill="${baseColor}"/>
                    <rect x="9" y="6" width="14" height="5" fill="${baseColor}"/>
                    <rect x="11" y="7" width="5" height="3" fill="${windowColor}"/>
                    <rect x="17" y="7" width="5" height="3" fill="${windowColor}"/>
                    <rect x="7" y="14" width="5" height="5" fill="${wheelColor}"/>
                    <rect x="8" y="15" width="3" height="3" fill="${rimColor}"/>
                    <rect x="20" y="14" width="5" height="5" fill="${wheelColor}"/>
                    <rect x="21" y="15" width="3" height="3" fill="${rimColor}"/>
                    <rect x="27" y="11" width="2" height="2" fill="#fbc531"/>
                    <rect x="3" y="11" width="2" height="2" fill="#e84118"/>
                `;
            } else {
                pixels = `
                    <rect x="2" y="11" width="28" height="5" fill="${baseColor}"/>
                    <rect x="10" y="8" width="12" height="4" fill="${baseColor}"/>
                    <rect x="22" y="10" width="6" height="3" fill="${baseColor}"/>
                    <rect x="13" y="9" width="8" height="2" fill="${windowColor}"/>
                    <rect x="6" y="13" width="6" height="6" fill="${wheelColor}"/>
                    <rect x="7" y="14" width="4" height="4" fill="${rimColor}"/>
                    <rect x="21" y="13" width="6" height="6" fill="${wheelColor}"/>
                    <rect x="22" y="14" width="4" height="4" fill="${rimColor}"/>
                    <rect x="28" y="12" width="3" height="1" fill="#00d2d3"/>
                    <rect x="1" y="12" width="2" height="2" fill="#ff4757"/>
                `;
            }

            return `<svg viewBox="0 0 32 20" width="${width}" height="${height}" shape-rendering="crispEdges" style="image-rendering: pixelated; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));">${pixels}${effects}</svg>`;
        }

        function updateBalance() {
            document.getElementById("balanceDisplay").innerText = balance.toLocaleString();
        }

        function topUp() {
            balance += 1000;
            updateBalance();
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getRandomMsg(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getRandomFailureReason() {
            return getRandomMsg(failureMessages);
        }

        function formatCurrency(num) {
            return "$" + num.toLocaleString();
        }

        function animateProgressBar(barElement, durationMs, onComplete) {
            let start = null;
            barElement.style.width = "0%";

            function step(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let pct = Math.min(100, (progress / durationMs) * 100);
                barElement.style.width = pct + "%";

                if (progress < durationMs) {
                    requestAnimationFrame(step);
                } else if (onComplete) {
                    onComplete();
                }
            }
            requestAnimationFrame(step);
        }

        function loadMoreCars(count) {
            let grid = document.getElementById("carGrid");
            let newHTML = "";
            for (let i = 0; i < count; i++) {
                let index = currentOffers.length;
                let carTemplate = fleet[randomInt(0, fleet.length - 1)];
                let condition = conditions[randomInt(0, 2)];
                
                let baseTier = condition === "Wrecked" ? 0 : (condition === "Normal wear" ? 1 : 2);
                let finalTier = Math.min(3, Math.max(0, baseTier + randomInt(-1, 1)));

                let priceMod = condition === "Wrecked" ? 0.6 : (condition === "Mint" ? 1.4 : 1.0);
                let finalPrice = Math.max(1, Math.floor(carTemplate.basePrice * priceMod));

                let car = {
                    ...carTemplate,
                    price: finalPrice,
                    condition: condition,
                    tierLevel: finalTier,
                    winChanceBonus: 0, 
                    invested: finalPrice,
                    isFixed: false
                };
                currentOffers.push(car);

                let pTier = potentialTiers[car.tierLevel];

                newHTML += `
                    <div class="car-card" onclick="selectCar(${index})">
                        <div class="tier-badge tier-${car.tier}">${car.tier}</div>
                        <h3>${car.name}</h3>
                        <div class="car-icon-container">
                            ${getCarPixelArtSVG(car.tier, car.condition, 90, 50)}
                        </div>
                        <div class="car-info-row">
                            <div>Cond: <span>${car.condition}</span></div>
                            <div>Price: <span style="color:var(--gold)">${formatCurrency(car.price)}</span></div>
                        </div>
                        <div class="pot-badge ${pTier.class}">${pTier.name}</div>
                    </div>
                `;
            }
            grid.insertAdjacentHTML('beforeend', newHTML);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("carGrid");
            grid.addEventListener("scroll", () => {
                if (grid.scrollWidth - grid.scrollLeft - grid.clientWidth < 100) {
                    loadMoreCars(3);
                }
            });
        });

        function simulateGameLoad() {
            const globalLoader = document.getElementById("global-loader");
            const loadBar = document.getElementById("globalProgressBar");
            const loadingText = document.getElementById("loadingText");
            
            document.getElementById("bootCarIcon").innerHTML = getCarPixelArtSVG("luxury", "Tuned Beast", 120, 75);

            animateProgressBar(loadBar, 1500, () => {
                loadingText.innerText = "System Ready!";
                loadingText.style.color = "var(--win)";
                loadingText.style.animation = "none";
                
                setTimeout(() => {
                    globalLoader.style.opacity = "0";
                    globalLoader.style.visibility = "hidden";
                    startRound();
                }, 400);
            });
        }

        function startRound() {
            document.getElementById("selectionPhase").style.display = "block";
            document.getElementById("actionArea").style.display = "none";
            document.getElementById("result-area").style.display = "none";
            document.getElementById("repair-result-banner").style.display = "none";
            
            lastRepairBanner = null;
            currentOffers = [];
            
            let grid = document.getElementById("carGrid");
            grid.innerHTML = "";
            
            loadMoreCars(5);
            grid.scrollLeft = 0;
        }

        function selectCar(index) {
            activeCar = currentOffers[index];
            if (balance < activeCar.price) {
                alert("Insufficient balance. Please deposit funds.");
                return;
            }

            balance -= activeCar.price;
            updateBalance();

            document.getElementById("selectionPhase").style.display = "none";
            document.getElementById("actionArea").style.display = "block";
            
            updateActionArea();
        }

        function updateActionArea() {
            document.getElementById("selectedCarName").innerText = activeCar.name;
            document.getElementById("actionCarIcon").innerHTML = getCarPixelArtSVG(activeCar.tier, activeCar.condition, 100, 60);
            
            let pTier = potentialTiers[activeCar.tierLevel];

            let fixCost = 0;
            let canFix = !activeCar.isFixed && activeCar.condition !== "Mint" && activeCar.condition !== "Tuned Beast";

            if (activeCar.condition === "Wrecked" || activeCar.condition === "Ruined") {
                fixCost = activeCar.price; 
            } else if (activeCar.condition === "Normal wear") {
                fixCost = Math.floor(activeCar.price * 0.50); 
            }

            let html = `
                <div class="car-info-row" style="margin-bottom: 10px;">
                    <div>Invested: <span>${formatCurrency(activeCar.invested)}</span></div>
                    <div>Cond: <span>${activeCar.condition}</span></div>
                </div>
                <div class="pot-badge ${pTier.class}" style="font-size:1rem;">Potential: ${pTier.name}</div>
            `;

            let bannerEl = document.getElementById("repair-result-banner");
            if (lastRepairBanner) {
                bannerEl.style.display = "block";
                bannerEl.className = lastRepairBanner.className;
                bannerEl.innerText = lastRepairBanner.text;
            } else {
                bannerEl.style.display = "none";
            }

            if (canFix && activeCar.tierLevel < 3) {
                html += `
                    <div style="background: rgba(255,215,0,0.1); padding: 12px; border-radius: 6px; margin-top: 15px; border: 1px dashed var(--gold);">
                        <p style="margin:0 0 5px 0; color: var(--gold); font-size: 0.9rem;"><strong>Repair Shop Gamble:</strong></p>
                        <p style="margin:0; font-size: 0.85rem; color: #ccc;">Pay ${formatCurrency(fixCost)} to fix! Success greatly improves market odds. Botched work degrades it.</p>
                    </div>
                `;
                document.getElementById("btnFix").style.display = "block";
                document.getElementById("btnFix").innerText = `Fix Car (-${formatCurrency(fixCost)})`;
                document.getElementById("btnFix").disabled = balance < fixCost;
                document.getElementById("btnSell").innerText = `Sell As Is`;
            } else {
                document.getElementById("btnFix").style.display = "none";
                document.getElementById("btnSell").innerText = `Sell Car`;
            }

            document.getElementById("selectedCarDetails").innerHTML = html;
        }

        function fixCar() {
            let fixCost = 0;
            if (activeCar.condition === "Wrecked" || activeCar.condition === "Ruined") fixCost = activeCar.price;
            else if (activeCar.condition === "Normal wear") fixCost = Math.floor(activeCar.price * 0.50);

            if (balance < fixCost) return;

            document.getElementById("btnFix").disabled = true;
            document.getElementById("btnSell").disabled = true;
            document.getElementById("loaderCarIcon").innerHTML = getCarPixelArtSVG(activeCar.tier, activeCar.condition, 90, 50);
            document.getElementById("overlay-loader").style.display = "flex";

            balance -= fixCost;
            activeCar.invested += fixCost;
            activeCar.isFixed = true; 

            let repairBar = document.getElementById("repairProgressBar");

            // Reduced repair time to 1 second
            animateProgressBar(repairBar, 1000, () => {
                let roll = Math.random();
                if (roll <= 0.15) {
                    activeCar.winChanceBonus -= 0.15;
                    activeCar.condition = "Ruined";
                    lastRepairBanner = { className: "repair-fail", text: getRandomMsg(repairEvents.fail) };
                } else if (roll <= 0.40) {
                    activeCar.winChanceBonus += 0.05;
                    activeCar.tierLevel = Math.min(3, activeCar.tierLevel + 1);
                    activeCar.condition = "Repaired";
                    lastRepairBanner = { className: "repair-shoddy", text: getRandomMsg(repairEvents.shoddy) };
                } else if (roll <= 0.85) {
                    activeCar.winChanceBonus += 0.15;
                    let jump = activeCar.condition === "Wrecked" ? 2 : 1;
                    activeCar.tierLevel = Math.min(3, activeCar.tierLevel + jump);
                    activeCar.condition = "Mint";
                    lastRepairBanner = { className: "repair-success", text: getRandomMsg(repairEvents.success) };
                } else {
                    activeCar.winChanceBonus += 0.30;
                    activeCar.tierLevel = 3;
                    activeCar.condition = "Tuned Beast";
                    lastRepairBanner = { className: "repair-jackpot", text: getRandomMsg(repairEvents.jackpot) };
                }
                
                updateBalance();
                updateActionArea();

                document.getElementById("overlay-loader").style.display = "none";
                document.getElementById("btnSell").disabled = false;
            });
        }

        function rollMultiplier(car) {
            let pTier = potentialTiers[car.tierLevel];
            let effectiveWinChance = Math.max(0.05, Math.min(0.95, pTier.winChance + car.winChanceBonus));

            let roll = Math.random();
            if (roll > effectiveWinChance) return 0; 

            let multRoll = Math.random() * 100;
            let cumulative = 0;
            for (let i = 0; i < pTier.pool.length; i++) {
                cumulative += pTier.pool[i].c;
                if (multRoll <= cumulative) {
                    let range = pTier.pool[i];
                    return Number((Math.random() * (range.max - range.min) + range.min).toFixed(2));
                }
            }
            let lastRange = pTier.pool[pTier.pool.length - 1];
            return Number((Math.random() * (lastRange.max - lastRange.min) + lastRange.min).toFixed(2));
        }

        function startSellPhase() {
            document.getElementById("actionArea").style.display = "none";
            document.getElementById("result-area").style.display = "block";
            document.getElementById("resultCarIcon").innerHTML = getCarPixelArtSVG(activeCar.tier, activeCar.condition, 110, 65);
            
            let statusEl = document.getElementById("statusText");
            let multEl = document.getElementById("multiplierDisplay");
            let coinsEl = document.getElementById("coinsWonDisplay");
            let nextBtn = document.getElementById("btnNextRound");
            let searchAnim = document.getElementById("searchAnim");
            let sellProgContainer = document.getElementById("sellProgressContainer");
            let skipBtn = document.getElementById("btnSkip");

            multEl.style.display = "none";
            multEl.className = "multiplier-display";
            coinsEl.innerHTML = "";
            nextBtn.style.display = "none";
            
            statusEl.className = "status-text pulsing";
            statusEl.style.color = "var(--accent)";
            searchAnim.style.display = "block";
            sellProgContainer.style.display = "block";
            skipBtn.style.display = "block"; // Show skip button

            currentFinalMult = rollMultiplier(activeCar);
            isSkipping = false;

            // Determine anticipation stages
            let maxStage = 1;
            if (currentFinalMult === 0) maxStage = 1;
            else if (currentFinalMult <= 2) maxStage = 2;
            else if (currentFinalMult <= 5) maxStage = 3;
            else if (currentFinalMult <= 20) maxStage = 4;
            else maxStage = 5;

            runStage(1, maxStage, currentFinalMult);
        }

        function runStage(stage, maxStage, finalMult) {
            if (isSkipping) return;
            
            let messages = [
                "Looking for a buyer...",
                "Buyer found, negotiating...",
                "Buyer likes to haggle...",
                "Buyer liked the car so much, he is giving extra cash!",
                "Suddenly it started raining money, today is our day! JACKPOT!"
            ];
            
            document.getElementById("statusText").innerText = messages[stage - 1];
            
            let bar = document.getElementById("sellProgressBar");
            let start = null;
            let durationMs = 1000;
            
            function step(timestamp) {
                if (isSkipping) return; // Halt animation instantly if skipped
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let pct = Math.min(100, (progress / durationMs) * 100);
                bar.style.width = pct + "%";

                if (progress < durationMs) {
                    requestAnimationFrame(step);
                } else {
                    if (stage < maxStage) {
                        runStage(stage + 1, maxStage, finalMult);
                    } else {
                        finishSellAnimation(finalMult);
                    }
                }
            }
            requestAnimationFrame(step);
        }

        function skipSellAnimation() {
            if (isSkipping) return;
            isSkipping = true;
            finishSellAnimation(currentFinalMult);
        }

        function finishSellAnimation(finalMult) {
            document.getElementById("btnSkip").style.display = "none";
            document.getElementById("searchAnim").style.display = "none";
            document.getElementById("sellProgressContainer").style.display = "none";
            
            let statusEl = document.getElementById("statusText");
            let multEl = document.getElementById("multiplierDisplay");
            let coinsEl = document.getElementById("coinsWonDisplay");
            let nextBtn = document.getElementById("btnNextRound");

            multEl.style.display = "block";

            if (finalMult === 0) {
                statusEl.innerText = getRandomFailureReason();
                statusEl.classList.remove("pulsing");
                multEl.innerText = "0.00x";
                multEl.classList.add("crashed");
                coinsEl.innerHTML = `Total Loss: <span>-${formatCurrency(activeCar.invested)}</span>`;
                nextBtn.style.display = "block";
            } else {
                statusEl.innerText = "SOLD!";
                animateMultiplier(finalMult, activeCar.invested);
            }
        }

        function animateMultiplier(targetMult, invested) {
            let multEl = document.getElementById("multiplierDisplay");
            let statusEl = document.getElementById("statusText");
            let coinsEl = document.getElementById("coinsWonDisplay");
            let nextBtn = document.getElementById("btnNextRound");
            
            let duration = 1000;
            if (targetMult > 2 && targetMult <= 10) duration = 1500;
            else if (targetMult > 10 && targetMult <= 50) duration = 2500;
            else if (targetMult > 50) duration = 4000;

            let frames = (duration / 1000) * 60;
            let step = (targetMult - 1.00) / frames;
            if (step < 0.01) step = 0.01;

            let currentMult = 1.00;

            function tick() {
                currentMult += step;
                if (currentMult >= targetMult) {
                    currentMult = targetMult;
                    
                    multEl.innerText = currentMult.toFixed(2) + "x";
                    multEl.classList.add("won");
                    statusEl.innerText = "SOLD!";
                    statusEl.style.color = "var(--win)";
                    statusEl.classList.remove("pulsing");
                    
                    let winnings = Math.floor(invested * currentMult);
                    balance += winnings;
                    updateBalance();
                    
                    coinsEl.innerHTML = `You won <span>${formatCurrency(winnings)}</span>!`;
                    nextBtn.style.display = "block";
                    return;
                }
                
                multEl.innerText = currentMult.toFixed(2) + "x";
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        window.onload = simulateGameLoad;
    </script>
</body>
</html>
