<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Flipping Simulator - Y2K Underground Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #090a0f; 
            --panel: rgba(18, 20, 28, 0.85); 
            --panel-border: #2a2e3d;
            --text: #e2e8f0;
            --accent: #00d2ff; 
            --accent-dark: #0088cc;
            --lose: #ff3f34; 
            --win: #0be881; 
            --gold: #ffd32a; 
            --mythic: #ff3f34;
            --cheap: #a4b0be;
            --font-racing: 'Oswald', sans-serif;
            --font-ui: 'Roboto', sans-serif;
        }
        
        body { 
            font-family: var(--font-ui); 
            background-color: var(--bg); 
            background-image: 
                linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text); 
            margin: 0; 
            padding: 0 0 40px 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow-x: hidden; 
        }
        
        h1, h2, h3 { font-family: var(--font-racing); font-style: italic; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        
        #global-loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1a1c29 0%, var(--bg) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease, visibility 0.4s ease; padding: 20px; }
        #global-loader h1 { color: var(--accent); font-size: 2.5rem; text-shadow: 0 0 20px rgba(0, 210, 255, 0.6); margin-bottom: 20px; }
        .global-progress-container { width: 100%; max-width: 400px; height: 14px; background: #000; border: 1px solid #333; transform: skew(-15deg); margin-top: 20px; overflow: hidden; }
        .global-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-dark), var(--accent)); box-shadow: 0 0 15px var(--accent); transition: width 0.1s ease; }
        .loading-text { color: var(--accent); margin-top: 15px; font-family: var(--font-racing); font-size: 1.1rem; animation: pulse 1s infinite; letter-spacing: 2px; }
        
        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; background: rgba(9, 10, 15, 0.95); backdrop-filter: blur(10px); padding: 15px 20px; border-bottom: 2px solid var(--accent); box-shadow: 0 4px 20px rgba(0, 210, 255, 0.15); position: sticky; top: 0; z-index: 100; transition: transform 0.3s ease; }
        .balance { font-family: var(--font-racing); font-size: 1.4rem; font-style: italic; color: white; letter-spacing: 1px; }
        .balance span { color: var(--win); text-shadow: 0 0 10px rgba(11, 232, 129, 0.4); transition: color 0.3s ease; }
        
        button { 
            font-family: var(--font-racing); font-style: italic; text-transform: uppercase; font-size: 1rem; letter-spacing: 1px;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent)); color: #000; 
            border: none; padding: 12px 20px; cursor: pointer; transition: 0.2s all; 
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            -webkit-tap-highlight-color: transparent;
        }
        button:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--accent); transform: translateY(-2px); }
        button:active { transform: translateY(2px) scale(0.98); }
        button:disabled { background: #333 !important; color: #666 !important; box-shadow: none !important; cursor: not-allowed; transform: none; filter: none; }
        
        .container { width: 100%; max-width: 800px; text-align: center; padding: 20px 10px; overflow: hidden; }
        .container > h2 { color: white; font-size: 1.8rem; margin-bottom: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        /* Base class for smoothly swapping game screens */
        .game-screen { display: none; width: 100%; opacity: 0; }
        
        .car-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 10px; width: 100%; }
        @media (min-width: 600px) { .car-grid { grid-template-columns: repeat(4, 1fr); } }
        
        .car-card { 
            background: linear-gradient(145deg, var(--panel), #0a0b10); 
            padding: 15px 10px; 
            border-top: 1px solid rgba(255,255,255,0.1);
            border-left: 1px solid rgba(255,255,255,0.05);
            cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 220px; transition: 0.25s all cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.6);
        }
        .car-card:hover { transform: translateY(-5px) scale(1.02); }
        .car-card:active { transform: scale(0.95); transition: 0.1s; }
        
        .car-card.tier-cheap:hover { box-shadow: 0 10px 20px rgba(164, 176, 190, 0.2); border-color: var(--cheap); }
        .car-card.tier-normal:hover { box-shadow: 0 10px 25px rgba(0, 210, 255, 0.3); border-color: var(--accent); }
        .car-card.tier-luxury:hover { box-shadow: 0 10px 25px rgba(255, 211, 42, 0.3); border-color: var(--gold); }
        .car-card.tier-collector:hover { box-shadow: 0 10px 30px rgba(255, 63, 52, 0.5); border-color: var(--mythic); }

        .car-card h3 { color: white; font-size: 1.1rem; line-height: 1.1; min-height: 2.2rem; display: flex; align-items: center; z-index: 2; margin-top: 5px; }
        
        .car-icon-container { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; margin-bottom: 5px; position: relative; }
        
        .car-img { width: 90%; height: 90%; object-fit: contain; z-index: 2; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.9)); transition: 0.4s all ease-out; }
        .car-card:hover .car-img { transform: scale(1.1) translateX(5px); }

        .car-info-row { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.85rem; color: #888; font-weight: 700; z-index: 2; }
        .car-info-row span { color: white; }

        .tier-badge { position: absolute; top: 0; right: 0; padding: 4px 10px; font-family: var(--font-racing); font-style: italic; font-size: 0.8rem; letter-spacing: 1px; clip-path: polygon(0 0, 100% 0, 100% 100%, 10px 100%); z-index: 5; }
        .badge-cheap { background: var(--cheap); color: #000; }
        .badge-normal { background: var(--accent); color: #000; }
        .badge-luxury { background: var(--gold); color: #000; }
        .badge-collector { background: var(--mythic); color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        
        .action-area { background: linear-gradient(to bottom, var(--panel), #050505); border: 1px solid var(--panel-border); padding: 25px 20px; border-radius: 8px; margin: 10px 15px; position: relative; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
        .action-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        .btn-sell, .btn-fix, .btn-cancel { width: 100%; padding: 14px; font-size: 1.1rem; }
        .btn-sell { background: linear-gradient(90deg, #05c46b, var(--win)); }
        .btn-fix { background: linear-gradient(90deg, #ffc048, var(--gold)); }
        .btn-cancel { background: transparent; border: 2px solid #555; color: #aaa; clip-path: none; transform: none; font-style: normal; }
        .btn-cancel:hover { background: rgba(255,255,255,0.05); transform: translateY(-2px); }
        
        #overlay-loader { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 10, 15, 0.95); backdrop-filter: blur(5px); border-radius: 8px; align-items: center; justify-content: center; flex-direction: column; z-index: 10; transition: opacity 0.3s ease; }
        #repair-result-banner { display: none; margin-top: 15px; padding: 12px; font-family: var(--font-racing); font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        
        .repair-fail { background: rgba(255, 63, 52, 0.1); border-left: 4px solid var(--lose); color: var(--lose); text-shadow: 0 0 8px rgba(255,63,52,0.4); }
        .repair-shoddy { background: rgba(255, 211, 42, 0.1); border-left: 4px solid var(--gold); color: var(--gold); text-shadow: 0 0 8px rgba(255,211,42,0.4); }
        .repair-success { background: rgba(0, 210, 255, 0.1); border-left: 4px solid var(--accent); color: var(--accent); text-shadow: 0 0 8px rgba(0,210,255,0.4); font-size: 1.05rem !important; }
        .repair-jackpot { background: rgba(11, 232, 129, 0.15); border-left: 4px solid var(--win); color: var(--win); text-shadow: 0 0 10px rgba(11,232,129,0.7); font-size: 1.15rem !important; }
        
        #result-area { margin: 15px; padding: 30px 15px; background: linear-gradient(180deg, rgba(31, 40, 51, 0.5) 0%, rgba(9, 10, 15, 0.9) 100%); border-top: 2px solid var(--accent); box-shadow: 0 10px 30px rgba(0, 210, 255, 0.1); position: relative; }
        .status-text { font-family: var(--font-racing); font-style: italic; font-size: 1.3rem; min-height: 2.8rem; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; justify-content: center; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 210, 255, 0.4); }
        
        .multiplier-display { font-family: var(--font-racing); font-size: 4.5rem; font-weight: 700; font-style: italic; color: white; margin: 10px 0; font-variant-numeric: tabular-nums; line-height: 1; }
        .multiplier-display.crashed { color: var(--lose); text-shadow: 3px 3px 0px #500, 0 0 20px rgba(255,63,52,0.6); }
        .multiplier-display.won { color: var(--win); text-shadow: 3px 3px 0px #055, 0 0 30px rgba(11, 232, 129, 0.8); transform: scale(1.1) skew(-5deg); transition: 0.4s all cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .coins-won { font-size: 1.1rem; color: #aaa; margin-bottom: 25px; height: 24px; font-weight: 700; text-transform: uppercase; }
        .coins-won span { color: var(--gold); font-size: 1.3rem; text-shadow: 0 0 10px rgba(255, 211, 42, 0.3); }
        
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255, 211, 42, 0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; box-shadow: 0 0 15px rgba(255, 211, 42, 0.2); }
        
        /* Fluid Transitions & Effects */
        .screen-enter { animation: slideInFade 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; display: block !important; }
        .screen-exit { animation: slideOutFade 0.25s ease forwards; pointer-events: none; }
        
        .power-flash { animation: powerUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .banner-enter { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; display: block !important; }
        
        .img-tuned { filter: drop-shadow(0 15px 15px rgba(0, 210, 255, 0.5)) drop-shadow(0 0 40px rgba(0, 210, 255, 0.3)) !important; animation: idleFloat 3s ease-in-out infinite; }

        .smoke-particle { position: absolute; bottom: 10%; width: 12px; height: 12px; background: rgba(80, 80, 80, 0.6); border-radius: 50%; filter: blur(5px); animation: smokeRise 2s infinite ease-in; z-index: 1; }
        .sparkle { position: absolute; top: 15%; right: 25%; width: 12px; height: 12px; background: white; clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%); animation: twinkle 2s infinite ease-in-out; z-index: 3; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        
        /* Screen Transitions */
        @keyframes slideInFade { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes slideOutFade { 0% { opacity: 1; transform: translateY(0); transform: scale(1); } 100% { opacity: 0; transform: translateY(-20px) scale(0.95); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        
        @keyframes powerUp { 0% { filter: brightness(1); transform: scale(1); } 30% { filter: brightness(2.5) contrast(1.2); transform: scale(1.05); box-shadow: 0 0 30px var(--accent); } 100% { filter: brightness(1); transform: scale(1); box-shadow: none; } }
        @keyframes idleFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
        @keyframes smokeRise { 0% { transform: translateY(0) scale(1); opacity: 0.8; } 100% { transform: translateY(-40px) scale(3); opacity: 0; } }
        @keyframes twinkle { 0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; } 50% { transform: scale(1.2) rotate(90deg); opacity: 1; } }
    </style>
</head>
<body>
    <div id="global-loader">
        <h1>Underground Garage</h1>
        <div id="bootCarIcon" class="car-icon-container" style="width: 250px; height: 150px; margin-bottom: 15px;"></div>
        <div class="global-progress-container"><div class="global-progress-bar" id="globalProgressBar"></div></div>
        <div class="loading-text" id="loadingText">Syncing Street Assets...</div>
    </div>
    
    <header>
        <div class="balance">Bank: <span id="balanceDisplay">5,000.00</span></div>
        <button onclick="topUp()">+ $2,500</button>
    </header>
    
    <div class="container">
        <!-- Replaced hard display styles with game-screen classes -->
        <div id="selectionPhase" class="game-screen">
            <h2 id="phaseTitle">Select a Ride</h2>
            <div class="car-grid" id="carGrid"></div>
        </div>
        
        <div id="actionArea" class="action-area game-screen">
            <div id="overlay-loader">
                <div class="spinner"></div>
                <h3 style="color:var(--gold); margin: 0 0 5px 0;">🔧 TUNING IN PROGRESS...</h3>
                <div class="global-progress-container" style="max-width: 250px;"><div class="global-progress-bar" style="background: var(--gold); box-shadow: 0 0 15px var(--gold);" id="repairProgressBar"></div></div>
            </div>
            
            <div id="actionCarIcon" class="car-icon-container" style="width:100%; max-width:400px; height:200px; margin: 0 auto 15px auto;"></div>
            <h2 id="selectedCarName" style="margin-top:0; font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">Car Name</h2>
            <div id="selectedCarDetails" style="font-size: 1rem; line-height: 1.5; margin-top: 10px;"></div>
            <div id="repair-result-banner"></div>
            
            <div class="action-buttons">
                <button class="btn-fix" id="btnFix" onclick="fixCar()">Tune Up</button>
                <button class="btn-sell" id="btnSell" onclick="startSellPhase()">Sell As Is</button>
            </div>
        </div>
        
        <div id="result-area" class="game-screen" style="border-radius: 8px;">
            <div class="status-text" id="statusText"></div>
            <div class="global-progress-container" id="sellProgressContainer" style="display:none; margin: 15px auto;">
                <div class="global-progress-bar" id="sellProgressBar" style="background: var(--accent); box-shadow: 0 0 15px var(--accent);"></div>
            </div>
            <button class="btn-cancel" id="btnSkip" onclick="skipSellAnimation()" style="display:none; margin: 15px auto; width: 100%; padding: 12px; font-family: var(--font-ui); font-weight: bold; text-transform: uppercase;">⏩ Skip Wait</button>
            <div class="multiplier-display" id="multiplierDisplay" style="display:none;">1.00x</div>
            <div class="coins-won" id="coinsWonDisplay"></div>
            <button id="btnNextRound" onclick="startRound()" style="display:none; margin: 0 auto; width: 100%; padding: 15px; font-size: 1.2rem;">Back to Streets</button>
        </div>
    </div>
    <script>
        const fleet = [
            { name: "Qenault Uwingo", tier: "cheap", basePrice: 10 },
            { name: "Jonda Divic", tier: "cheap", basePrice: 50 },
            { name: "Voyota Damry", tier: "normal", basePrice: 250 },
            { name: "Jonda Bccord", tier: "normal", basePrice: 750 },
            { name: "Nercedes H-Wagon", tier: "luxury", basePrice: 2500 },
            { name: "Mamborghini Juracan", tier: "luxury", basePrice: 5000 },
            { name: "Pugatti Shiron", tier: "collector", basePrice: 7500 },
            { name: "McKaren F1 Classic", tier: "collector", basePrice: 10000 }
        ];
        
        const conditions = ["Wrecked", "Worn", "Clean"];
        
        const potentialTiers = [
            { id: 0, winChance: 0.81, pool: [{min: 1.01, max: 1.15, c: 75}, {min: 1.16, max: 1.50, c: 20}, {min: 1.51, max: 2.50, c: 5}] }, 
            { id: 1, winChance: 0.67, pool: [{min: 1.01, max: 1.30, c: 80}, {min: 1.31, max: 2.50, c: 15}, {min: 2.51, max: 5.00, c: 4}, {min: 5.01, max: 10.00, c: 1}] }, 
            { id: 2, winChance: 0.44, pool: [{min: 1.05, max: 1.50, c: 70}, {min: 1.51, max: 3.50, c: 20}, {min: 3.51, max: 8.00, c: 8}, {min: 8.01, max: 25.00, c: 2}] }, 
            { id: 3, winChance: 0.26, pool: [{min: 1.05, max: 2.00, c: 75}, {min: 2.01, max: 5.00, c: 15}, {min: 5.01, max: 15.00, c: 8}, {min: 15.01, max: 100.00, c: 2}] }, 
            { id: 4, winChance: 0.13, pool: [{min: 1.05, max: 2.00, c: 75}, {min: 2.01, max: 10.00, c: 15}, {min: 10.01, max: 50.00, c: 8}, {min: 50.01, max: 250.00, c: 2}] } 
        ];

        const repairEvents = {
            fail: ["💥 Mechanic broke a leg mid-repair! Engine ruined.", "🤦 Mechanic dropped your engine block! Severe damage.", "⚡ Mechanic wired the battery backwards and fried electronics!", "🔥 Mechanic used a blowtorch near the gas tank. Oops.", "🦝 A family of raccoons moved into the engine bay.", "🛸 Alien abduction reported. Car returned as a cube.", "🔨 Mechanic sneezed while holding a sledgehammer. Totaled."],
            shoddy: ["🍺 Mechanic was hungover, but duct-taped the bumper (+1 Tier).", "🌾 Mechanic used parts from an old lawnmower (+1 Tier).", "🛠️ Mechanic patched the leak with chewing gum (+1 Tier)."],
            success: ["✨ Mechanic worked overtime and restored it clean (+1 Tier)!", "🏎️ Mechanic tuned it up to factory perfection (+1 Tier)!", "🧼 Mechanic buffed out every scratch till it shined (+1 Tier)!"],
            jackpot: ["🎂 Mechanic gave you a free mystery upgrade (+2 Tiers)!", "🚀 Mechanic secretly installed a nitro boost (+2 Tiers)!", "👑 Mechanic accidentally turned your car into a street legend (+2 Tiers)!"]
        };

        let balance = 5000;
        let currentOffers = [];
        let activeCar = null;
        let lastRepairBanner = null;
        let isSkipping = false;
        let currentFinalMult = 0;
        let roundCount = 0; 
        
        let currentScreen = null;

        // Fluid Screen Switcher
        async function switchScreen(screenId) {
            const screens = ["selectionPhase", "actionArea", "result-area"];
            
            // Fade out the old screen if there is one
            if (currentScreen && currentScreen !== screenId) {
                let hideEl = document.getElementById(currentScreen);
                hideEl.classList.remove("screen-enter");
                hideEl.classList.add("screen-exit");
                // Wait for the quick exit animation
                await new Promise(r => setTimeout(r, 200)); 
                hideEl.style.display = "none";
                hideEl.classList.remove("screen-exit");
            }
            
            // Immediately hide everything else just in case
            screens.forEach(id => {
                if(id !== screenId) document.getElementById(id).style.display = "none";
            });

            // Slide in the new screen
            const showEl = document.getElementById(screenId);
            showEl.style.display = "block";
            // Reflow hack to restart animation smoothly
            void showEl.offsetWidth; 
            showEl.classList.add("screen-enter");
            currentScreen = screenId;
        }

        function getFileName(carName, imageState) {
            let filePrefix = "";
            switch(carName) {
                case "Qenault Uwingo": filePrefix = "uwingo"; break;
                case "Jonda Divic": filePrefix = "divic"; break;
                case "Voyota Damry": filePrefix = "damry"; break;
                case "Jonda Bccord": filePrefix = "bccord"; break;
                case "Nercedes H-Wagon": filePrefix = "hwagon"; break;
                case "Mamborghini Juracan": filePrefix = "jurracan"; break;
                case "Pugatti Shiron": filePrefix = imageState === "mint" ? "Shiron" : "shiron"; break;
                case "McKaren F1 Classic": filePrefix = imageState === "mint" ? "f1Classic" : "f1classic"; break;
                default: filePrefix = "uwingo";
            }
            return `cars/${filePrefix}_${imageState}.png`;
        }

        function getCarVisuals(carName, condition) {
            let imageState = "mint";
            let effectsHtml = "";
            let imgClass = "";
            
            if (condition === "Wrecked" || condition === "Ruined") {
                imageState = "wrecked";
                effectsHtml = `<div class="smoke-particle" style="left:35%; animation-delay: 0s;"></div><div class="smoke-particle" style="left:50%; animation-delay: 0.8s; transform: scale(1.2);"></div><div class="smoke-particle" style="left:65%; animation-delay: 1.6s;"></div>`;
            } else if (condition === "Worn") {
                imageState = "used";
            } else if (condition === "Clean" || condition === "Repaired") {
                imageState = "mint";
                effectsHtml = `<div class="sparkle"></div>`;
            } else if (condition === "Tuned Beast") {
                imageState = "tuned";
                imgClass = "img-tuned"; 
            }

            let imgSrc = getFileName(carName, imageState);

            return `<div style="position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;">
                        ${effectsHtml}
                        <img src="${imgSrc}" class="car-img ${imgClass}" alt="${carName}" onerror="this.src='https://via.placeholder.com/400x200/1e272e/00d2ff?text=Missing+Image';">
                    </div>`;
        }

        function preloadAssets() {
            const loadingText = document.getElementById("loadingText");
            const progressBar = document.getElementById("globalProgressBar");
            
            let allUrls = [];
            fleet.forEach(car => { ["mint", "used", "tuned", "wrecked"].forEach(state => { allUrls.push(getFileName(car.name, state)); }); });

            let loadedCount = 0; let isFinished = false;

            function checkDone() {
                if (isFinished) return;
                if (loadedCount >= allUrls.length) {
                    isFinished = true;
                    loadingText.innerText = "ALL ASSETS LOADED";
                    loadingText.style.color = "var(--win)";
                    setTimeout(() => {
                        document.getElementById("global-loader").style.opacity = "0";
                        setTimeout(() => { document.getElementById("global-loader").style.display = "none"; startRound(); }, 400);
                    }, 400);
                }
            }

            allUrls.forEach(url => {
                let img = new Image();
                img.onload = () => { loadedCount++; progressBar.style.width = (loadedCount / allUrls.length) * 100 + "%"; checkDone(); };
                img.onerror = () => { loadedCount++; progressBar.style.width = (loadedCount / allUrls.length) * 100 + "%"; checkDone(); }; 
                img.src = url;
            });

            setTimeout(() => { if (!isFinished) { loadedCount = allUrls.length; checkDone(); } }, 8000);
        }

        function updateBalance() { document.getElementById("balanceDisplay").innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
        function topUp() { balance += 2500; updateBalance(); }
        function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function formatCurrency(num) { return "$" + num.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
        function animateProgressBar(barElement, durationMs, onComplete) {
            let start = null; barElement.style.width = "0%";
            function step(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                barElement.style.width = Math.min(100, (progress / durationMs) * 100) + "%";
                if (progress < durationMs) requestAnimationFrame(step);
                else if (onComplete) onComplete();
            }
            requestAnimationFrame(step);
        }

        function loadMoreCars(count) {
            let grid = document.getElementById("carGrid");
            let newHTML = "";
            let allowCollector = roundCount > 3; 
            for (let i = 0; i < count; i++) {
                let roll = Math.random();
                let targetTier = "cheap";
                if (allowCollector) {
                    if (roll < 0.60) targetTier = "cheap"; else if (roll < 0.85) targetTier = "normal"; else if (roll < 0.97) targetTier = "luxury"; else targetTier = "collector";
                } else {
                    if (roll < 0.65) targetTier = "cheap"; else if (roll < 0.95) targetTier = "normal"; else targetTier = "luxury";
                }

                let validCars = fleet.filter(c => c.tier === targetTier);
                let carTemplate = validCars[randomInt(0, validCars.length - 1)];
                let condition = conditions[randomInt(0, 2)];
                
                let baseTierLevel = targetTier === "cheap" ? 0 : (targetTier === "normal" ? 1 : (targetTier === "luxury" ? 2 : 3));
                let finalTier = condition === "Wrecked" ? Math.max(0, baseTierLevel - 1) : (condition === "Clean" ? Math.min(4, baseTierLevel + 1) : baseTierLevel);
                
                let priceMod = condition === "Wrecked" ? 0.6 : (condition === "Clean" ? 1.4 : 1.0);
                let finalPrice = carTemplate.basePrice * priceMod;

                let car = { ...carTemplate, price: finalPrice, condition: condition, originalCondition: condition, baseTierLevel: baseTierLevel, currentTierLevel: finalTier, invested: finalPrice, isFixed: false };
                currentOffers.push(car);
                
                newHTML += `<div class="car-card tier-${car.tier}" onclick="selectCar(${currentOffers.length - 1})"><div class="tier-badge badge-${car.tier}">${car.tier}</div><h3>${car.name}</h3><div class="car-icon-container">${getCarVisuals(car.name, car.condition)}</div><div class="car-info-row"><div>Cond: <span style="color:white;">${car.condition}</span></div><div>Price: <span style="color:var(--gold)">${formatCurrency(car.price)}</span></div></div></div>`;
            }
            grid.innerHTML = newHTML; 
        }

        function startRound() {
            roundCount++; 
            lastRepairBanner = null; currentOffers = []; loadMoreCars(4);
            document.getElementById("repair-result-banner").style.display = "none";
            document.getElementById("repair-result-banner").classList.remove("banner-enter");
            switchScreen("selectionPhase");
        }

        function selectCar(index) {
            activeCar = currentOffers[index];
            if (balance < activeCar.price) return alert("Insufficient funds in your bank.");
            balance -= activeCar.price; updateBalance();
            updateActionArea(false);
            switchScreen("actionArea");
        }

        function updateActionArea(isRepair = false) {
            document.getElementById("selectedCarName").innerText = activeCar.name;
            
            let iconEl = document.getElementById("actionCarIcon");
            iconEl.innerHTML = getCarVisuals(activeCar.name, activeCar.condition);
            
            if (isRepair) {
                iconEl.classList.remove("power-flash");
                void iconEl.offsetWidth; 
                iconEl.classList.add("power-flash");
            }

            let fixCost = activeCar.condition === "Wrecked" ? activeCar.price : (activeCar.condition === "Worn" ? activeCar.price * 0.50 : activeCar.price * 0.25);
            let canFix = !activeCar.isFixed && activeCar.condition !== "Ruined" && activeCar.condition !== "Tuned Beast";

            let html = `<div class="car-info-row" style="margin-bottom: 10px; font-size: 1.05rem; color: #fff;"><div>Total Invested: <span style="color:var(--gold);">${formatCurrency(activeCar.invested)}</span></div><div style="margin-top:5px;">Condition: <span style="color:var(--accent);">${activeCar.condition}</span></div></div>`;

            if (lastRepairBanner) {
                let bannerEl = document.getElementById("repair-result-banner");
                bannerEl.className = `banner-enter ${lastRepairBanner.className}`; 
                bannerEl.innerText = lastRepairBanner.text;
            }

            let btnFix = document.getElementById("btnFix");
            let btnSell = document.getElementById("btnSell");

            if (activeCar.condition === "Ruined") {
                btnFix.style.display = "none";
                btnSell.innerText = "Return to Streets";
                btnSell.onclick = startRound;
                btnSell.style.background = "transparent";
                btnSell.style.border = "2px solid #555";
                btnSell.style.color = "#ccc";
                btnSell.style.boxShadow = "none";
            } else if (canFix) {
                html += `<div style="background: rgba(255,211,42,0.05); padding: 15px; border-radius: 4px; margin-top: 20px; border-left: 3px solid var(--gold); box-shadow: 0 0 15px rgba(255,211,42,0.1);"><p style="margin:0 0 5px 0; color: var(--gold); font-family: var(--font-racing); font-size: 1.1rem; font-style:italic; letter-spacing: 1px;">UNDERGROUND TUNING:</p><p style="margin:0; font-size: 0.9rem; color: #ccc;">Pay ${formatCurrency(fixCost)} for a performance tune. <span style="color:var(--lose); font-weight:bold;">FAILS WILL BRICK THE CAR.</span></p></div>`;
                btnFix.style.display = "block";
                btnFix.innerText = `Tune Up (-${formatCurrency(fixCost)})`;
                btnFix.disabled = balance < fixCost;
                btnSell.innerText = `Sell As Is`;
                btnSell.onclick = startSellPhase;
                btnSell.style.background = "linear-gradient(90deg, #05c46b, var(--win))";
                btnSell.style.border = "none";
                btnSell.style.color = "#000";
            } else {
                btnFix.style.display = "none";
                btnSell.innerText = `Sell Ride`;
                btnSell.onclick = startSellPhase;
                btnSell.style.background = "linear-gradient(90deg, #05c46b, var(--win))";
                btnSell.style.border = "none";
                btnSell.style.color = "#000";
            }
            document.getElementById("selectedCarDetails").innerHTML = html;
        }

        function fixCar() {
            let fixCost = activeCar.condition === "Wrecked" ? activeCar.price : (activeCar.condition === "Worn" ? activeCar.price * 0.50 : activeCar.price * 0.25);
            if (balance < fixCost) return;
            document.getElementById("btnFix").disabled = true; document.getElementById("btnSell").disabled = true;
            let overlay = document.getElementById("overlay-loader");
            overlay.style.display = "flex"; overlay.style.opacity = "1";

            balance -= fixCost; activeCar.invested += fixCost; activeCar.isFixed = true; 

            let loaderBar = document.getElementById("repairProgressBar");
            loaderBar.style.transition = "none"; loaderBar.style.width = "0%";
            setTimeout(() => { loaderBar.style.transition = "width 1.2s linear"; loaderBar.style.width = "100%"; }, 50);

            setTimeout(() => {
                let roll = Math.random(); let bTier = activeCar.baseTierLevel;
                let failMsgs = repairEvents.fail; let randomFailMsg = failMsgs[Math.floor(Math.random() * failMsgs.length)];

                if (activeCar.condition === "Wrecked") {
                    if (roll <= 0.35) { activeCar.condition = "Ruined"; lastRepairBanner = { className: "repair-fail", text: randomFailMsg }; }
                    else if (roll <= 0.70) { activeCar.currentTierLevel = Math.min(4, bTier + 1); activeCar.condition = "Repaired"; lastRepairBanner = { className: "repair-shoddy", text: repairEvents.shoddy[Math.floor(Math.random() * repairEvents.shoddy.length)] }; }
                    else { activeCar.currentTierLevel = Math.min(4, bTier + 2); activeCar.condition = "Tuned Beast"; lastRepairBanner = { className: "repair-jackpot", text: repairEvents.jackpot[Math.floor(Math.random() * repairEvents.jackpot.length)] }; }
                } else if (activeCar.condition === "Worn") {
                    if (roll <= 0.20) { activeCar.condition = "Ruined"; lastRepairBanner = { className: "repair-fail", text: randomFailMsg }; }
                    else if (roll <= 0.85) { activeCar.currentTierLevel = Math.min(4, bTier + 1); activeCar.condition = "Repaired"; lastRepairBanner = { className: "repair-success", text: repairEvents.success[Math.floor(Math.random() * repairEvents.success.length)] }; }
                    else { activeCar.currentTierLevel = Math.min(4, bTier + 2); activeCar.condition = "Tuned Beast"; lastRepairBanner = { className: "repair-jackpot", text: repairEvents.jackpot[Math.floor(Math.random() * repairEvents.jackpot.length)] }; }
                } else if (activeCar.condition === "Clean") {
                    if (roll <= 0.15) { activeCar.condition = "Ruined"; lastRepairBanner = { className: "repair-fail", text: randomFailMsg }; }
                    else { activeCar.currentTierLevel = Math.min(4, bTier + 1); activeCar.condition = "Tuned Beast"; lastRepairBanner = { className: "repair-success", text: "Flawless Tune! (+1 Tier Max)" }; }
                }
                
                updateBalance(); 
                updateActionArea(true);
                
                overlay.style.opacity = "0";
                setTimeout(() => { overlay.style.display = "none"; document.getElementById("btnSell").disabled = false; }, 300);
            }, 1200);
        }

        function rollMultiplier(car) {
            if (car.condition === "Ruined") return 0; 
            let pTier = potentialTiers[car.currentTierLevel];
            if (Math.random() > pTier.winChance) return 0; 
            
            let multRoll = Math.random() * 100, cumulative = 0; let finalMult = 0;
            for (let i = 0; i < pTier.pool.length; i++) {
                cumulative += pTier.pool[i].c;
                if (multRoll <= cumulative) { finalMult = (Math.random() * (pTier.pool[i].max - pTier.pool[i].min) + pTier.pool[i].min); break; }
            }
            if (finalMult === 0) finalMult = (Math.random() * (pTier.pool[pTier.pool.length - 1].max - pTier.pool[pTier.pool.length - 1].min) + pTier.pool[pTier.pool.length - 1].min);

            if (car.isFixed) {
                if (car.originalCondition === "Wrecked") finalMult *= 1.55;
                if (car.originalCondition === "Worn") finalMult *= 1.26;
                if (car.originalCondition === "Clean") finalMult *= 1.18;
            }
            return Number(finalMult.toFixed(2));
        }

        function startSellPhase() {
            document.getElementById("multiplierDisplay").style.display = "none"; 
            document.getElementById("btnNextRound").style.display = "none";
            document.getElementById("statusText").className = "status-text pulsing"; 
            document.getElementById("sellProgressContainer").style.display = "block";
            document.getElementById("btnSkip").style.display = "block"; 
            
            currentFinalMult = rollMultiplier(activeCar); isSkipping = false;
            let maxStage = currentFinalMult === 0 ? 1 : (currentFinalMult <= 2 ? 2 : (currentFinalMult <= 10 ? 3 : (currentFinalMult <= 50 ? 4 : 5)));
            
            switchScreen("result-area").then(() => {
                runStage(1, maxStage, currentFinalMult);
            });
        }

        function runStage(stage, maxStage, finalMult) {
            if (isSkipping) return;
            let msgs = ["Snooping the underground market...", "Rival crew showed interest...", "Negotiating pink slips...", "They love the tune, pushing price up!", "MYTHIC JACKPOT! STREET LEGEND!"];
            document.getElementById("statusText").innerText = msgs[stage - 1];
            
            let bar = document.getElementById("sellProgressBar");
            bar.style.transition = "none"; bar.style.width = "0%";
            setTimeout(() => { bar.style.transition = "width 1s linear"; bar.style.width = "100%"; }, 20);

            setTimeout(() => {
                if (isSkipping) return;
                if (stage < maxStage) runStage(stage + 1, maxStage, finalMult);
                else finishSellAnimation(finalMult);
            }, 1000);
        }

        function skipSellAnimation() { if (isSkipping) return; isSkipping = true; finishSellAnimation(currentFinalMult); }

        function finishSellAnimation(finalMult) {
            document.getElementById("btnSkip").style.display = "none"; document.getElementById("sellProgressContainer").style.display = "none";
            let multEl = document.getElementById("multiplierDisplay"); multEl.style.display = "block";
            if (finalMult === 0) {
                document.getElementById("statusText").innerText = "Total Loss. They walked away.";
                multEl.innerText = "0.00x"; multEl.className = "multiplier-display crashed";
                document.getElementById("coinsWonDisplay").innerHTML = `Loss: <span style="color:var(--lose);">-${formatCurrency(activeCar.invested)}</span>`;
                document.getElementById("btnNextRound").style.display = "block";
            } else {
                document.getElementById("statusText").innerText = "DEAL CLOSED!"; animateMultiplier(finalMult, activeCar.invested);
            }
        }

        function animateMultiplier(targetMult, invested) {
            let multEl = document.getElementById("multiplierDisplay");
            let duration = targetMult > 50 ? 3000 : (targetMult > 10 ? 2000 : 1000);
            let frames = (duration / 1000) * 60, step = Math.max(0.01, (targetMult - 1.00) / frames), currentMult = 1.00;
            function tick() {
                currentMult += step;
                if (currentMult >= targetMult) {
                    multEl.innerText = targetMult.toFixed(2) + "x"; multEl.className = "multiplier-display won";
                    let winnings = Number((invested * targetMult).toFixed(2)); balance += winnings; updateBalance();
                    document.getElementById("coinsWonDisplay").innerHTML = `Banked: <span>${formatCurrency(winnings)}</span>`;
                    document.getElementById("btnNextRound").style.display = "block";
                    return;
                }
                multEl.innerText = currentMult.toFixed(2) + "x"; requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }
        
        window.onload = () => {
            document.getElementById("bootCarIcon").innerHTML = getCarVisuals("Mamborghini Juracan", "Tuned Beast");
            preloadAssets();
        };
    </script>
</body>
</html>
