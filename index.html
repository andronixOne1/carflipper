<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Flipping Simulator - True Economy Fix</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b0c10; --panel: #1f2833; --text: #c5c6c7;
            --accent: #66fcf1; --accent-dark: #45a29e;
            --lose: #ff4757; --win: #2ed573; --gold: #ffd700; --mythic: #d63031;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0 0 40px 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        #global-loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease-out, visibility 0.5s ease-out; padding: 20px; }
        #global-loader h1 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(102, 252, 241, 0.5); }
        .global-progress-container { width: 100%; max-width: 400px; height: 20px; background: #111; border: 2px solid #444; border-radius: 4px; padding: 2px; margin-top: 20px; }
        .global-progress-bar { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .loading-text { color: #aaa; margin-top: 15px; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; animation: pulse 1s infinite; }
        
        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; background: rgba(31, 40, 51, 0.95); backdrop-filter: blur(10px); padding: 12px 15px; border-bottom: 3px solid var(--accent-dark); position: sticky; top: 0; z-index: 100; }
        .balance { font-size: 1.1rem; font-weight: bold; color: white; }
        .balance span { color: var(--accent); }
        button { background: var(--accent); color: #000; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.95); }
        button:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; transform: none; }
        
        .container { width: 100%; max-width: 800px; text-align: center; padding: 15px 0; }
        h2 { color: white; font-size: 1.3rem; margin: 5px 0 10px 0;}
        
        .car-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 10px 15px 20px 15px; width: 100%; }
        @media (min-width: 600px) { .car-grid { grid-template-columns: repeat(4, 1fr); } }
        
        .car-card { background: var(--panel); padding: 15px 10px; border-radius: 10px; border: 2px solid #333; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 200px; transition: 0.2s transform; }
        .car-card:active { transform: scale(0.96); border-color: var(--accent); }
        .car-card h3 { margin: 15px 0 0 0; color: white; font-size: 0.95rem; text-align: center; line-height: 1.2; min-height: 2.4rem; display: flex; align-items: center; }
        .car-icon-container { width: 100%; height: 65px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid #333; }
        .car-info-row { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 5px 0 0 0; font-size: 0.85rem; color: #aaa; }
        .car-info-row span { color: white; font-weight: bold; }
        
        .tier-badge { position: absolute; top: 0; right: 0; padding: 4px 8px; font-size: 0.65rem; font-weight: bold; border-bottom-left-radius: 8px; text-transform: uppercase; }
        .tier-cheap { background: #747d8c; color: white; }
        .tier-normal { background: #3742fa; color: white; }
        .tier-luxury { background: var(--gold); color: black; }
        .tier-collector { background: var(--mythic); color: white; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        
        .action-area { background: var(--panel); padding: 20px 15px; border-radius: 10px; margin: 10px 15px; display: none; position: relative; }
        .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-sell, .btn-fix, .btn-cancel { width: 100%; padding: 12px; font-size: 0.95rem; }
        .btn-sell { background: var(--win); color: white; }
        .btn-fix { background: var(--gold); color: black; }
        .btn-cancel { background: transparent; border: 1px solid #555; color: #ccc; }
        
        .progress-container { width: 100%; max-width: 320px; height: 12px; background: #111; border: 1px solid #444; border-radius: 6px; margin: 15px auto; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-dark), var(--accent)); }
        .progress-bar.gold { background: linear-gradient(90deg, #ffa502, var(--gold)); }
        
        #overlay-loader { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(31, 40, 51, 0.95); border-radius: 10px; align-items: center; justify-content: center; flex-direction: column; z-index: 10; }
        #repair-result-banner { display: none; margin-top: 10px; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; animation: fadeIn 0.4s ease-in-out; }
        .repair-fail { background: rgba(255, 71, 87, 0.2); border: 1px solid var(--lose); color: var(--lose); }
        .repair-shoddy { background: rgba(255, 165, 2, 0.2); border: 1px solid #ffa502; color: #ffa502; }
        .repair-success { background: rgba(46, 213, 115, 0.2); border: 1px solid var(--win); color: var(--win); }
        .repair-jackpot { background: rgba(214, 48, 49, 0.2); border: 1px solid var(--mythic); color: var(--mythic); text-shadow: 0 0 5px rgba(214, 48, 49, 0.5); }
        
        #result-area { display: none; margin: 15px; padding: 25px 15px; background: radial-gradient(circle, var(--panel) 0%, var(--bg) 100%); border-radius: 10px; border: 1px solid #333; }
        .status-text { font-size: 1rem; line-height: 1.4; min-height: 2.8rem; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
        .multiplier-display { font-size: 3.5rem; font-weight: 900; color: white; margin: 5px 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .multiplier-display.crashed { color: var(--lose); text-shadow: 0 0 15px rgba(255,71,87,0.4); }
        .multiplier-display.won { color: var(--win); text-shadow: 0 0 20px rgba(46,213,115,0.6); transform: scale(1.05); transition: 0.3s transform; }
        .coins-won { font-size: 1rem; color: #aaa; margin-bottom: 20px; height: 20px; }
        .coins-won span { color: var(--gold); font-weight: bold; }
        
        .spinner { width: 30px; height: 30px; border: 3px solid #444; border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="global-loader">
        <h1>Car Flip Simulator</h1>
        <div id="bootCarIcon" style="margin-bottom: 10px;"></div>
        <div class="global-progress-container"><div class="global-progress-bar" id="globalProgressBar"></div></div>
        <div class="loading-text" id="loadingText">Booting Arcade System...</div>
    </div>
    
    <header>
        <div class="balance">Bal: <span id="balanceDisplay">5,000.00</span></div>
        <button onclick="topUp()">+ $2,500.00</button>
    </header>
    
    <div class="container">
        <div id="selectionPhase">
            <h2 id="phaseTitle">Select a Car to Flip</h2>
            <div class="car-grid" id="carGrid"></div>
        </div>
        
        <div class="action-area" id="actionArea">
            <div id="overlay-loader">
                <div class="spinner"></div>
                <h3 style="color:var(--gold); margin: 0 0 5px 0;">🔧 Working...</h3>
                <div class="progress-container"><div class="progress-bar gold" id="repairProgressBar"></div></div>
            </div>
            
            <div id="actionCarIcon" class="car-icon-container" style="width:140px; height:80px; margin: 0 auto 10px auto;"></div>
            <h2 id="selectedCarName" style="margin-top:0;">Car Name</h2>
            <div id="selectedCarDetails" style="font-size: 0.95rem; line-height: 1.4;"></div>
            <div id="repair-result-banner"></div>
            
            <div class="action-buttons">
                <button class="btn-fix" id="btnFix" onclick="fixCar()">Fix Car</button>
                <button class="btn-sell" id="btnSell" onclick="startSellPhase()">Sell As Is</button>
            </div>
        </div>
        
        <div id="result-area">
            <div class="status-text" id="statusText"></div>
            <div class="progress-container" id="sellProgressContainer" style="display:none; margin-top: 5px;">
                <div class="progress-bar" id="sellProgressBar"></div>
            </div>
            <button class="btn-cancel" id="btnSkip" onclick="skipSellAnimation()" style="display:none; margin: 10px auto; width: 100%; padding: 10px;">⏩ Skip Wait</button>
            <div class="multiplier-display" id="multiplierDisplay" style="display:none;">1.00x</div>
            <div class="coins-won" id="coinsWonDisplay"></div>
            <button id="btnNextRound" onclick="startRound()" style="display:none; margin: 0 auto; width: 100%; padding: 12px;">Play Next Round</button>
        </div>
    </div>
    <script>
        const fleet = [
            { name: "Qenault Uwingo", tier: "cheap", basePrice: 10 },
            { name: "Jonda Divic", tier: "cheap", basePrice: 50 },
            { name: "Voyota Damry", tier: "normal", basePrice: 250 },
            { name: "Jonda Bccord", tier: "normal", basePrice: 750 },
            { name: "Nercedes H-Wagon", tier: "luxury", basePrice: 2500 },
            { name: "Mamborghini Juracan", tier: "luxury", basePrice: 5000 },
            { name: "Pugatti Shiron", tier: "collector", basePrice: 7500 },
            { name: "McKaren F1 Classic", tier: "collector", basePrice: 10000 }
        ];
        
        const conditions = ["Wrecked", "Worn", "Clean"];
        
        const potentialTiers = [
            { id: 0, winChance: 0.81, pool: [{min: 1.01, max: 1.15, c: 75}, {min: 1.16, max: 1.50, c: 20}, {min: 1.51, max: 2.50, c: 5}] }, 
            { id: 1, winChance: 0.67, pool: [{min: 1.01, max: 1.30, c: 80}, {min: 1.31, max: 2.50, c: 15}, {min: 2.51, max: 5.00, c: 4}, {min: 5.01, max: 10.00, c: 1}] }, 
            { id: 2, winChance: 0.44, pool: [{min: 1.05, max: 1.50, c: 70}, {min: 1.51, max: 3.50, c: 20}, {min: 3.51, max: 8.00, c: 8}, {min: 8.01, max: 25.00, c: 2}] }, 
            { id: 3, winChance: 0.26, pool: [{min: 1.05, max: 2.00, c: 75}, {min: 2.01, max: 5.00, c: 15}, {min: 5.01, max: 15.00, c: 8}, {min: 15.01, max: 100.00, c: 2}] }, 
            { id: 4, winChance: 0.13, pool: [{min: 1.05, max: 2.00, c: 75}, {min: 2.01, max: 10.00, c: 15}, {min: 10.01, max: 50.00, c: 8}, {min: 50.01, max: 250.00, c: 2}] } 
        ];

        const repairEvents = {
            fail: [
                "💥 Mechanic broke a leg mid-repair! Engine ruined.", "🤦 Mechanic dropped your engine block! Severe damage.", "🎰 Mechanic gambled your money away and damaged parts.",
                "⚡ Mechanic wired the battery backwards and fried electronics!", "🔥 Mechanic used a blowtorch near the gas tank. Oops.", "🦝 A family of raccoons moved into the engine bay.",
                "🛸 Alien abduction reported at the garage. Car returned as a cube.", "🔨 Mechanic sneezed while holding a sledgehammer. Totaled.", "🌊 Left the windows down during a flash flood in the shop.",
                "🌪️ Mechanic accidentally built a tornado machine instead of an engine.", "🧀 Mechanic tried to fix the radiator with melted cheese.", "🦍 A stray silverback gorilla got loose in the garage.",
                "💥 Lift failure! The car plummeted 10 feet onto its roof.", "🚜 Mechanic backed over it with a forklift.", "🔥 Spontaneous combustion! Nobody knows why.",
                "🐭 Rats chewed through the entire wiring harness.", "🎨 Mechanic painted it invisible and now we can't find it.", "⚡ Struck by indoor lightning. Don't ask how.",
                "💣 Mechanic installed a 'nitro' button that was actually self-destruct.", "🦈 Dropped it into the shop's shark tank.", "🪄 Mechanic tried a magic trick and made the chassis disappear.",
                "🪚 Mechanic sawed the car in half by mistake.", "🧲 Turned the car into a giant electromagnet. It's stuck to the ceiling.", "☢️ Radioactive coolant leak. The car is now glowing and unsafe."
            ],
            shoddy: ["🍺 Mechanic was hungover, but duct-taped the bumper (+1 Tier).", "🌾 Mechanic used parts from an old lawnmower (+1 Tier).", "🛠️ Mechanic patched the leak with chewing gum (+1 Tier)."],
            success: ["✨ Mechanic worked overtime and restored it clean (+1 Tier)!", "🏎️ Mechanic tuned the engine to factory perfection (+1 Tier)!", "🧼 Mechanic buffed out every scratch till it shined (+1 Tier)!"],
            jackpot: ["🎂 Mechanic gave you a free twin-turbo upgrade (+2 Tiers)!", "🚀 Mechanic secretly installed a nitrous system (+2 Tiers)!", "👑 Mechanic accidentally turned your car into a street legend (+2 Tiers)!"]
        };

        let balance = 5000;
        let currentOffers = [];
        let activeCar = null;
        let lastRepairBanner = null;
        let isSkipping = false;
        let currentFinalMult = 0;
        let roundCount = 0; 

        function getCarPixelArtSVG(tier, condition, width = 80, height = 50) {
            let baseColor = tier === "cheap" ? "#747d8c" : (tier === "normal" ? "#3742fa" : (tier === "luxury" ? "#ffd700" : "#d63031"));
            let windowColor = "#70a1ff";
            let pixels = `<rect x="2" y="11" width="28" height="5" fill="${baseColor}"/><rect x="10" y="8" width="12" height="4" fill="${baseColor}"/><rect x="22" y="10" width="6" height="3" fill="${baseColor}"/><rect x="13" y="9" width="8" height="2" fill="${windowColor}"/><rect x="6" y="13" width="6" height="6" fill="#1e272e"/><rect x="7" y="14" width="4" height="4" fill="#d2dae2"/><rect x="21" y="13" width="6" height="6" fill="#1e272e"/><rect x="22" y="14" width="4" height="4" fill="#d2dae2"/>`;
            let effects = "";
            if (condition === "Wrecked" || condition === "Ruined") {
                effects = `<rect x="6" y="2" width="2" height="2" fill="#718093" opacity="0.8"/><rect x="24" y="10" width="3" height="2" fill="#c0392b"/>`;
            } else if (condition === "Clean" || condition === "Repaired" || condition === "Tuned Beast") {
                effects = `<polygon points="26,3 27,5 29,5 27,7 28,9 26,8 24,9 25,7 23,5 25,5" fill="#ffffff"/>`;
            }
            return `<svg viewBox="0 0 32 20" width="${width}" height="${height}" style="image-rendering: pixelated; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));">${pixels}${effects}</svg>`;
        }

        function updateBalance() { 
            document.getElementById("balanceDisplay").innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); 
        }
        function topUp() { 
            balance += 2500; 
            updateBalance(); 
        }
        function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function formatCurrency(num) { 
            return "$" + num.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); 
        }

        function animateProgressBar(barElement, durationMs, onComplete) {
            let start = null; barElement.style.width = "0%";
            function step(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                barElement.style.width = Math.min(100, (progress / durationMs) * 100) + "%";
                if (progress < durationMs) requestAnimationFrame(step);
                else if (onComplete) onComplete();
            }
            requestAnimationFrame(step);
        }
        function loadMoreCars(count) {
            let grid = document.getElementById("carGrid");
            let newHTML = "";
            let allowCollector = roundCount > 3; 
            for (let i = 0; i < count; i++) {
                let roll = Math.random();
                let targetTier = "cheap";
                if (allowCollector) {
                    if (roll < 0.60) targetTier = "cheap";
                    else if (roll < 0.85) targetTier = "normal";
                    else if (roll < 0.97) targetTier = "luxury";
                    else targetTier = "collector";
                } else {
                    if (roll < 0.65) targetTier = "cheap";
                    else if (roll < 0.95) targetTier = "normal";
                    else targetTier = "luxury";
                }

                let validCars = fleet.filter(c => c.tier === targetTier);
                let carTemplate = validCars[randomInt(0, validCars.length - 1)];
                let condition = conditions[randomInt(0, 2)];
                
                let baseTierLevel = targetTier === "cheap" ? 0 : (targetTier === "normal" ? 1 : (targetTier === "luxury" ? 2 : 3));
                let finalTier = condition === "Wrecked" ? Math.max(0, baseTierLevel - 1) : (condition === "Clean" ? Math.min(4, baseTierLevel + 1) : baseTierLevel);
                
                let priceMod = condition === "Wrecked" ? 0.6 : (condition === "Clean" ? 1.4 : 1.0);
                let finalPrice = carTemplate.basePrice * priceMod;

                let car = { ...carTemplate, price: finalPrice, condition: condition, originalCondition: condition, baseTierLevel: baseTierLevel, currentTierLevel: finalTier, invested: finalPrice, isFixed: false };
                currentOffers.push(car);
                newHTML += `<div class="car-card" onclick="selectCar(${currentOffers.length - 1})"><div class="tier-badge tier-${car.tier}">${car.tier}</div><h3>${car.name}</h3><div class="car-icon-container">${getCarPixelArtSVG(car.tier, car.condition, 90, 50)}</div><div class="car-info-row"><div>Cond: <span style="color:white;">${car.condition}</span></div><div>Price: <span style="color:var(--gold)">${formatCurrency(car.price)}</span></div></div></div>`;
            }
            grid.innerHTML = newHTML; 
        }

        function simulateGameLoad() {
            document.getElementById("bootCarIcon").innerHTML = getCarPixelArtSVG("collector", "Tuned Beast", 120, 75);
            const loadingText = document.getElementById("loadingText");
            
            animateProgressBar(document.getElementById("globalProgressBar"), 1500, () => {
                loadingText.innerText = "System Ready!";
                loadingText.style.color = "var(--win)";
                loadingText.style.animation = "none";
                setTimeout(() => {
                    document.getElementById("global-loader").style.opacity = "0";
                    setTimeout(() => { document.getElementById("global-loader").style.display = "none"; startRound(); }, 400);
                }, 400);
            });
        }

        function startRound() {
            roundCount++; document.getElementById("selectionPhase").style.display = "block";
            document.getElementById("actionArea").style.display = "none";
            document.getElementById("result-area").style.display = "none";
            document.getElementById("repair-result-banner").style.display = "none";
            lastRepairBanner = null; currentOffers = []; loadMoreCars(4);
        }

        function selectCar(index) {
            activeCar = currentOffers[index];
            if (balance < activeCar.price) return alert("Insufficient balance.");
            balance -= activeCar.price; updateBalance();
            document.getElementById("selectionPhase").style.display = "none";
            document.getElementById("actionArea").style.display = "block";
            updateActionArea();
        }

        function updateActionArea() {
            document.getElementById("selectedCarName").innerText = activeCar.name;
            document.getElementById("actionCarIcon").innerHTML = getCarPixelArtSVG(activeCar.tier, activeCar.condition, 100, 60);

            let fixCost = activeCar.condition === "Wrecked" ? activeCar.price : (activeCar.condition === "Worn" ? activeCar.price * 0.50 : activeCar.price * 0.25);
            let canFix = !activeCar.isFixed && activeCar.condition !== "Ruined" && activeCar.condition !== "Tuned Beast";

            let html = `<div class="car-info-row" style="margin-bottom: 10px; font-size: 0.95rem;"><div>Invested: <span style="color:var(--gold);">${formatCurrency(activeCar.invested)}</span></div><div>Condition: <span style="color:white;">${activeCar.condition}</span></div></div>`;

            if (lastRepairBanner) {
                let bannerEl = document.getElementById("repair-result-banner");
                bannerEl.style.display = "block"; bannerEl.className = lastRepairBanner.className; bannerEl.innerText = lastRepairBanner.text;
            }

            let btnFix = document.getElementById("btnFix");
            let btnSell = document.getElementById("btnSell");

            if (activeCar.condition === "Ruined") {
                btnFix.style.display = "none";
                btnSell.innerText = "Go Back";
                btnSell.onclick = startRound;
                btnSell.style.background = "transparent";
                btnSell.style.border = "1px solid #555";
                btnSell.style.color = "#ccc";
            } else if (canFix) {
                html += `<div style="background: rgba(255,215,0,0.1); padding: 12px; border-radius: 6px; margin-top: 15px; border: 1px dashed var(--gold);"><p style="margin:0 0 5px 0; color: var(--gold); font-size: 0.9rem;"><strong>Tuning Shop:</strong></p><p style="margin:0; font-size: 0.85rem; color: #ccc;">Pay ${formatCurrency(fixCost)} to upgrade tier. Fails will RUIN the car entirely.</p></div>`;
                btnFix.style.display = "block";
                btnFix.innerText = `Tune Up (-${formatCurrency(fixCost)})`;
                btnFix.disabled = balance < fixCost;
                btnSell.innerText = `Sell As Is`;
                btnSell.onclick = startSellPhase;
                btnSell.style.background = "var(--win)";
                btnSell.style.border = "none";
                btnSell.style.color = "white";
            } else {
                btnFix.style.display = "none";
                btnSell.innerText = `Sell Car`;
                btnSell.onclick = startSellPhase;
                btnSell.style.background = "var(--win)";
                btnSell.style.border = "none";
                btnSell.style.color = "white";
            }
            
            document.getElementById("selectedCarDetails").innerHTML = html;
        }

        function fixCar() {
            let fixCost = activeCar.condition === "Wrecked" ? activeCar.price : (activeCar.condition === "Worn" ? activeCar.price * 0.50 : activeCar.price * 0.25);
            if (balance < fixCost) return;
            document.getElementById("btnFix").disabled = true; document.getElementById("btnSell").disabled = true;
            document.getElementById("overlay-loader").style.display = "flex";

            balance -= fixCost; activeCar.invested += fixCost; activeCar.isFixed = true; 

            animateProgressBar(document.getElementById("repairProgressBar"), 1000, () => {
                let roll = Math.random(); let bTier = activeCar.baseTierLevel;
                let failMsgs = repairEvents.fail;
                let randomFailMsg = failMsgs[Math.floor(Math.random() * failMsgs.length)];

                if (activeCar.condition === "Wrecked") {
                    if (roll <= 0.35) { activeCar.condition = "Ruined"; lastRepairBanner = { className: "repair-fail", text: randomFailMsg }; }
                    else if (roll <= 0.70) { activeCar.currentTierLevel = Math.min(4, bTier + 1); activeCar.condition = "Repaired"; lastRepairBanner = { className: "repair-shoddy", text: repairEvents.shoddy[Math.floor(Math.random() * repairEvents.shoddy.length)] }; }
                    else { activeCar.currentTierLevel = Math.min(4, bTier + 2); activeCar.condition = "Tuned Beast"; lastRepairBanner = { className: "repair-jackpot", text: repairEvents.jackpot[Math.floor(Math.random() * repairEvents.jackpot.length)] }; }
                } else if (activeCar.condition === "Worn") {
                    if (roll <= 0.20) { activeCar.condition = "Ruined"; lastRepairBanner = { className: "repair-fail", text: randomFailMsg }; }
                    else if (roll <= 0.85) { activeCar.currentTierLevel = Math.min(4, bTier + 1); activeCar.condition = "Repaired"; lastRepairBanner = { className: "repair-success", text: repairEvents.success[Math.floor(Math.random() * repairEvents.success.length)] }; }
                    else { activeCar.currentTierLevel = Math.min(4, bTier + 2); activeCar.condition = "Tuned Beast"; lastRepairBanner = { className: "repair-jackpot", text: repairEvents.jackpot[Math.floor(Math.random() * repairEvents.jackpot.length)] }; }
                } else if (activeCar.condition === "Clean") {
                    if (roll <= 0.15) { activeCar.condition = "Ruined"; lastRepairBanner = { className: "repair-fail", text: randomFailMsg }; }
                    else { activeCar.currentTierLevel = Math.min(4, bTier + 1); activeCar.condition = "Tuned Beast"; lastRepairBanner = { className: "repair-success", text: "Flawless Tune! (+1 Tier Max)" }; }
                }
                updateBalance(); updateActionArea();
                document.getElementById("overlay-loader").style.display = "none";
                document.getElementById("btnSell").disabled = false;
            });
        }

        function rollMultiplier(car) {
            if (car.condition === "Ruined") return 0; 
            
            let pTier = potentialTiers[car.currentTierLevel];
            if (Math.random() > pTier.winChance) return 0; 
            
            let multRoll = Math.random() * 100, cumulative = 0;
            let finalMult = 0;

            for (let i = 0; i < pTier.pool.length; i++) {
                cumulative += pTier.pool[i].c;
                if (multRoll <= cumulative) {
                    finalMult = (Math.random() * (pTier.pool[i].max - pTier.pool[i].min) + pTier.pool[i].min);
                    break;
                }
            }
            if (finalMult === 0) finalMult = (Math.random() * (pTier.pool[pTier.pool.length - 1].max - pTier.pool[pTier.pool.length - 1].min) + pTier.pool[pTier.pool.length - 1].min);

            if (car.isFixed) {
                if (car.originalCondition === "Wrecked") finalMult *= 1.55;
                if (car.originalCondition === "Worn") finalMult *= 1.26;
                if (car.originalCondition === "Clean") finalMult *= 1.18;
            }

            return Number(finalMult.toFixed(2));
        }

        function startSellPhase() {
            document.getElementById("actionArea").style.display = "none"; document.getElementById("result-area").style.display = "block";
            document.getElementById("multiplierDisplay").style.display = "none"; document.getElementById("btnNextRound").style.display = "none";
            document.getElementById("statusText").className = "status-text pulsing"; document.getElementById("sellProgressContainer").style.display = "block";
            document.getElementById("btnSkip").style.display = "block"; 
            
            currentFinalMult = rollMultiplier(activeCar); 
            isSkipping = false;
            
            let maxStage = currentFinalMult === 0 ? 1 : (currentFinalMult <= 2 ? 2 : (currentFinalMult <= 10 ? 3 : (currentFinalMult <= 50 ? 4 : 5)));
            runStage(1, maxStage, currentFinalMult);
        }

        function runStage(stage, maxStage, finalMult) {
            if (isSkipping) return;
            let msgs = ["Looking for a buyer...", "Buyer found, negotiating...", "Buyer likes to haggle...", "Buyer loves it, paying a premium!", "MYTHIC JACKPOT! RAINING CASH!"];
            document.getElementById("statusText").innerText = msgs[stage - 1];
            animateProgressBar(document.getElementById("sellProgressBar"), 1000, () => {
                if (isSkipping) return;
                if (stage < maxStage) runStage(stage + 1, maxStage, finalMult);
                else finishSellAnimation(finalMult);
            });
        }

        function skipSellAnimation() { if (isSkipping) return; isSkipping = true; finishSellAnimation(currentFinalMult); }

        function finishSellAnimation(finalMult) {
            document.getElementById("btnSkip").style.display = "none"; document.getElementById("sellProgressContainer").style.display = "none";
            let multEl = document.getElementById("multiplierDisplay"); multEl.style.display = "block";
            if (finalMult === 0) {
                document.getElementById("statusText").innerText = activeCar.condition === "Ruined" ? "Car is destroyed. Sent to scrapyard." : "Total Loss. Deal fell through.";
                multEl.innerText = "0.00x"; multEl.className = "multiplier-display crashed";
                document.getElementById("coinsWonDisplay").innerHTML = `Loss: <span>-${formatCurrency(activeCar.invested)}</span>`;
                document.getElementById("btnNextRound").style.display = "block";
            } else {
                document.getElementById("statusText").innerText = "SOLD!"; animateMultiplier(finalMult, activeCar.invested);
            }
        }

        function animateMultiplier(targetMult, invested) {
            let multEl = document.getElementById("multiplierDisplay");
            let duration = targetMult > 50 ? 3000 : (targetMult > 10 ? 2000 : 1000);
            let frames = (duration / 1000) * 60, step = Math.max(0.01, (targetMult - 1.00) / frames), currentMult = 1.00;
            function tick() {
                currentMult += step;
                if (currentMult >= targetMult) {
                    multEl.innerText = targetMult.toFixed(2) + "x"; multEl.className = "multiplier-display won";
                    let winnings = Number((invested * targetMult).toFixed(2)); balance += winnings; updateBalance();
                    document.getElementById("coinsWonDisplay").innerHTML = `Won <span>${formatCurrency(winnings)}</span>!`;
                    document.getElementById("btnNextRound").style.display = "block";
                    return;
                }
                multEl.innerText = currentMult.toFixed(2) + "x"; requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }
        
        window.onload = simulateGameLoad;
    </script>
</body>
</html>
